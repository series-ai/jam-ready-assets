name: Update visual asset metadata

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: visual-asset-metadata
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      METADATA_BRANCH: automation/visual-asset-metadata
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --requirement scripts/visual-requirements.txt
      - name: Build current runtime inventory
        run: SKIP_PUBLISHED_CHECK=1 node scripts/build-manifest.mjs
      - name: Restore pending generated metadata
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/visual-resume"
          if git ls-remote --exit-code --heads origin "$METADATA_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$METADATA_BRANCH"
            git rev-parse FETCH_HEAD > "$RUNNER_TEMP/visual-branch-head"
            git lfs fetch origin "$METADATA_BRANCH" --include='metadata/thumbnails/*.tar' --exclude=''
            git archive FETCH_HEAD metadata | tar -x -C "$RUNNER_TEMP/visual-resume"
          fi
      - name: Generate missing visual metadata
        id: generate
        continue-on-error: true
        timeout-minutes: 40
        env:
          ASSET_VISION_OPENAI_API_KEY: ${{ secrets.ASSET_VISION_OPENAI_API_KEY }}
        run: >-
          node scripts/generate-visual-labels.mjs
          --resume-dir "$RUNNER_TEMP/visual-resume"
          --status-file "$RUNNER_TEMP/visual-status.json"
          --limit 200 --concurrency 3 --max-seconds 1800
      - name: Save accepted metadata and open its pull request
        if: always() && steps.generate.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- metadata)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$METADATA_BRANCH"
          git add -- metadata
          git commit -m 'Update image descriptions and visual search metadata'
          previous=''
          if [ -f "$RUNNER_TEMP/visual-branch-head" ]; then
            previous="$(cat "$RUNNER_TEMP/visual-branch-head")"
          fi
          git push "--force-with-lease=refs/heads/$METADATA_BRANCH:$previous" origin "HEAD:refs/heads/$METADATA_BRANCH"
          existing="$(gh pr list --head "$METADATA_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            cat > "$RUNNER_TEMP/visual-pr-body.md" <<'BODY'
          Adds visual descriptions, search terms and static previews for newly indexed images. Original asset files and pack versions stay unchanged.
          BODY
            gh pr create --base main --head "$METADATA_BRANCH" --title 'Update visual asset metadata' --body-file "$RUNNER_TEMP/visual-pr-body.md"
          fi
          gh workflow run check-packs.yml --ref "$METADATA_BRANCH"
      - name: Report incomplete generation
        if: always() && steps.generate.outcome == 'failure'
        run: |
          echo '::error::Visual metadata generation did not finish. Accepted records were saved when available; inspect the generation step before retrying.'
          exit 1
