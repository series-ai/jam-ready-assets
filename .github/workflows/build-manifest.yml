name: Build asset manifest + mirror to GCS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # OIDC for Workload Identity Federation — no stored secret
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # pointers only — mirror script pulls just the missing objects
          fetch-depth: 0   # full history — each pack's addedAt is its first-add commit date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: node --test scripts/license-policy.test.mjs scripts/pack-dates.test.mjs scripts/featured.test.mjs
      # Exits non-zero only when a pack that is already published would be dropped. A pack that
      # has never shipped is skipped instead, so one bad contribution cannot freeze the whole
      # catalogue behind a symptom ("new packs don't show up") nobody notices for weeks.
      - run: node scripts/build-manifest.mjs
      - run: node scripts/mirror-to-gcs.mjs
      - name: Fail on any skipped pack
        if: always()
        run: |
          if [ -f .rejected-packs.json ]; then
            echo "::error::Published the good packs, but some were skipped. See the REJECTED lines above."
            cat .rejected-packs.json
            exit 1
          fi
